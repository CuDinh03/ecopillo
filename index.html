    <!-- Ảnh nền đầu trang chủ (Bảng EC, LCP): điện thoại tải ảnh dọc, máy tính tải ảnh ngang.
         Chỉ tải trước khi mở trang chủ: ở trang khác nó giành đường truyền với ảnh bìa của chính trang đó
         (audit 16/10/2026: trang Giới thiệu, Khách sạn LCP 4,6–4,8s vì ảnh này). -->
    <!-- Trang Giới thiệu, Khách sạn và dự án: tải trước ảnh bìa (LCP) ngay từ đầu, không chờ mã của trang.
         Đường link lấy theo PATHS.about, PATHS.hotel trong src/data/links.ts; đổi ảnh bìa thì sửa cả ở đây. -->
    <script>
      const COVERS = {
        '/': [
          ['/images/hero/bang-ec-ai-mobile-900.webp 900w, /images/hero/bang-ec-ai-mobile-1800.webp 1771w', '770px', '(max-width: 767px)'],
          ['/images/hero/bang-ec-ai-desktop-1600.webp 1600w, /images/hero/bang-ec-ai-desktop-2400.webp 2400w, /images/hero/bang-ec-ai-desktop-3200.webp 3200w', '(min-width: 1280px) 100vw, 1460px', '(min-width: 768px)'],
        ],
        '/gioi-thieu/': [
          ['/images/about/chi-phuong-sm.webp 800w, /images/about/chi-phuong.webp 1309w', '(min-width: 1024px) 42vw, 100vw', 'all'],
        ],
        '/danh-muc-san-pham/du-an-khach-san-nha-nghi/': [
          ['/images/hotel/phong-king-cua-kinh-sm.webp 640w, /images/hotel/phong-king-cua-kinh.webp 1600w', '(min-width: 1024px) 50vw, 100vw', 'all'],
        ],
      }
      const path = location.pathname.endsWith('/') ? location.pathname : location.pathname + '/'
      if (COVERS[path]) {
        for (const [srcset, sizes, media] of COVERS[path]) {
          const link = document.createElement('link')
          link.rel = 'preload'
          link.as = 'image'
          link.setAttribute('imagesrcset', srcset)
          link.setAttribute('imagesizes', sizes)
          link.media = media
          link.fetchPriority = 'high'
          document.head.appendChild(link)
        }
      }
    </script>
